<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Kaosedhewe</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-navy { background-color: #021a48; }
    .text-navy { color: #021a48; }
    .border-navy { border-color: #021a48; }
    .bg-gold { background-color: #dccf95; }
    .text-gold { color: #dccf95; }
    .border-gold { border-color: #dccf95; }
    .hover-bg-navy:hover { background-color: #03276d; }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen px-4 font-sans select-none">
  <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl w-full max-w-md border border-slate-200">
    
    <!-- Header Card dengan Logo -->
    <div class="text-center mb-8 flex flex-col items-center">
      <img src="/logo.png" alt="Logo Kaosedhewe" class="w-24 h-24 object-contain rounded-full shadow-md mb-3 border-2 border-[#dccf95]">
      <h2 class="text-3xl font-black text-navy tracking-wider">KAOSEDHEWE</h2>
      <div class="inline-block mt-2 bg-gold/30 border border-gold px-3 py-0.5 rounded-full">
        <p class="text-[11px] font-extrabold text-navy uppercase tracking-widest">Admin Dashboard Login</p>
      </div>
    </div>

    <!-- Form Login -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Username</label>
        <input 
          type="text" 
          id="username" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#021a48] focus:bg-white text-sm text-slate-800 transition" 
          placeholder="admin" 
          required
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            class="w-full pl-4 pr-11 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#021a48] focus:bg-white text-sm text-slate-800 transition" 
            placeholder="••••••••" 
            required
          >
          <button 
            type="button" 
            onclick="togglePassword()" 
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-navy focus:outline-none transition"
          >
            <!-- Ikon Mata Terbuka -->
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <!-- Ikon Mata Tertutup -->
            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Kotak Notifikasi Error -->
      <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs px-3.5 py-2.5 rounded-xl flex items-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="errorText"></span>
      </div>

      <!-- Tombol Masuk -->
      <button 
        type="submit" 
        class="w-full bg-navy hover-bg-navy text-gold py-3 rounded-xl font-bold tracking-wider uppercase transition duration-150 shadow-md active:scale-95 text-sm"
      >
        Masuk
      </button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const pwInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');

      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      } else {
        pwInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      errorBox.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errorText.textContent = data.message || 'Username atau password salah!';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorText.textContent = 'Tidak dapat terhubung ke server backend.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
