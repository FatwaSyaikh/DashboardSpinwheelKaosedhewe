<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Spinwheel Doorprize - Kaosedhewe</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-navy-dark { background-color: #010f2b; }
    .bg-navy-main { background-color: #021a48; }
    .text-navy { color: #021a48; }
    .border-navy { border-color: #021a48; }
    .text-gold { color: #dccf95; }
    .bg-gold { background-color: #dccf95; }
    .border-gold { border-color: #dccf95; }
    .hover-bg-gold:hover { background-color: #c9bc83; }
    .hover-bg-navy:hover { background-color: #042970; }
  </style>
</head>
<body class="bg-navy-dark min-h-screen flex flex-col items-center justify-center p-4 md:p-8 font-sans select-none text-slate-800">

  <!-- Tombol Fullscreen -->
  <button onclick="toggleFullScreen()" class="fixed top-5 right-5 z-50 bg-[#021a48] hover:bg-[#042970] text-[#dccf95] border border-[#dccf95]/50 p-3 rounded-2xl shadow-xl transition active:scale-95" title="Layar Penuh">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
    </svg>
  </button>

  <!-- Container Utama Putih Bersih dengan Border Gold -->
  <div class="w-full max-w-6xl bg-white border-4 border-[#dccf95] rounded-3xl p-6 sm:p-10 shadow-2xl">
    
    <!-- Header Branding -->
    <div class="flex items-center border-b border-slate-200 pb-5 mb-8">
      <div class="flex items-center space-x-4">
        <img src="/logo.png" alt="Logo Kaosedhewe" class="w-14 h-14 object-contain rounded-full border-2 border-gold shadow-md bg-white">
        <div>
          <h1 class="text-3xl font-black text-navy tracking-wider">KAOSEDHEWE</h1>
          <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Doorprize Lucky Spinwheel</p>
        </div>
      </div>
    </div>

    <!-- Grid 2 Kolom: Arena Roda & Formulir -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">
      
      <!-- SISI KIRI: ARENA RODA SPINWHEEL -->
      <div class="lg:col-span-6 flex flex-col items-center justify-center bg-slate-50 border border-slate-200 p-6 rounded-3xl shadow-sm">
        <div class="relative w-80 h-80 sm:w-[390px] sm:h-[390px] flex items-center justify-center p-2 rounded-full bg-white border-2 border-slate-200 shadow-inner">
          
          <!-- Jarum Petunjuk Atas -->
          <div class="absolute -top-3.5 z-30 w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-t-[34px] border-t-[#021a48] drop-shadow-lg"></div>
          
          <!-- Pin Tengah Roda KD -->
          <div class="absolute z-20 w-16 h-16 bg-navy-main rounded-full border-4 border-gold shadow-xl flex items-center justify-center">
            <span class="text-gold font-black text-sm tracking-wider">KD</span>
          </div>

          <!-- Roda Canvas -->
          <canvas id="wheel" width="400" height="400" class="rounded-full shadow-xl border-4 border-gold transition-all duration-[4500ms] cubic-bezier(0.1, 0.9, 0.2, 1) w-76 h-76 sm:w-[360px] sm:h-[360px]"></canvas>
        </div>

        <button id="spinBtn" onclick="mulaiPutaran()" class="mt-7 w-full sm:w-auto px-12 py-3.5 bg-navy-main hover-bg-navy text-gold font-black uppercase rounded-full shadow-xl transition tracking-widest text-base hover:scale-105 active:scale-95 duration-150 border border-gold">
          Putar Roda Sekarang
        </button>
      </div>

      <!-- SISI KANAN: FORMULIR INPUT TIKET -->
      <div class="lg:col-span-6 space-y-4">
        <div class="bg-slate-50 border border-slate-200 p-5 rounded-2xl">
          <h2 class="text-xl font-black text-navy tracking-wide">Masukkan Data Tiket</h2>
          <p class="text-sm text-slate-500 mt-1">Lengkapi nomor transaksi dan biodata Anda sesuai nota belanja Kaosedhewe.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Kode Transaksi</label>
            <input type="text" id="trxId" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-mono uppercase text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="TRX-001" required>
          </div>
          <div>
            <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">No. WhatsApp</label>
            <input type="text" id="nohp" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-mono text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="08123456789" required>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Nama Lengkap</label>
          <input type="text" id="nama" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Asal Kota</label>
          <input type="text" id="kota" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="Contoh: Semarang" required>
        </div>

        <!-- Kotak Error -->
        <div id="errorBox" class="hidden p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="errorText"></span>
        </div>

        <!-- Kotak Pengumuman Pemenang -->
        <div id="resultBox" class="hidden p-5 bg-slate-50 border-2 border-gold rounded-2xl text-center space-y-3 shadow-md">
          <p class="text-sm font-bold text-slate-700">🎉 Selamat! Anda Memenangkan:</p>
          <div class="flex justify-center my-2">
            <img id="hadiahImg" src="" alt="Hadiah" class="w-24 h-24 object-contain rounded-2xl bg-white p-2.5 border border-slate-200 shadow-sm">
          </div>
          <p id="hadiahText" class="text-2xl font-black text-navy tracking-wide"></p>
          
          <div>
            <span class="inline-block text-xs bg-emerald-100 text-emerald-800 font-extrabold px-4 py-1 rounded-full border border-emerald-300">
              Tunjukkan layar / bukti ini ke kasir Kaosedhewe
            </span>
          </div>

          <!-- Tombol Salin Bukti & WA -->
          <div class="pt-2 flex flex-col sm:flex-row gap-2 justify-center">
            <button id="copyBtn" onclick="salinBuktiKlaim()" class="w-full sm:w-auto px-4 py-2.5 bg-white hover:bg-slate-100 text-navy font-bold text-xs rounded-xl border border-slate-300 shadow-sm transition flex items-center justify-center space-x-2 active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-navy" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
              </svg>
              <span id="copyBtnText">Salin Teks Bukti</span>
            </button>

            <button onclick="kirimKeWhatsApp()" class="w-full sm:w-auto px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition flex items-center justify-center space-x-2 active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
              </svg>
              <span>Kirim ke WhatsApp</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const colors = ['#021a48', '#07255f', '#021a48', '#07255f', '#021a48', '#07255f'];

    let prizeList = [];
    let loadedImages = [];
    let isSpinning = false;
    let currentRotation = 0;
    let buktiKlaimTeks = '';

    // Ambil list hadiah dinamis dari database
    async function initPrizeList() {
      try {
        const res = await fetch('/api/hadiah');
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          prizeList = json.data;
        } else {
          // Fallback default
          prizeList = [
            { id: 1, nama: 'Kaos Kaosedhewe', gambar: '/kaos.png', fallback_icon: '👕' },
            { id: 2, nama: 'Tote Bag Kanvas', gambar: '/totebag.png', fallback_icon: '👜' },
            { id: 3, nama: 'Voucher 50%', gambar: '/voucher.png', fallback_icon: '🎟️' },
            { id: 4, nama: 'Sticker Pack', gambar: '/sticker.png', fallback_icon: '🏷️' },
            { id: 5, nama: 'Hoodie Kaos', gambar: '/hoodie.png', fallback_icon: '🧥' },
            { id: 6, nama: 'Gantungan Kunci', gambar: '/gantungan.png', fallback_icon: '🔑' }
          ];
        }

        preloadImagesAndDraw();
      } catch (err) {
        console.error('Gagal mengambil data hadiah:', err);
      }
    }

    function preloadImagesAndDraw() {
      loadedImages = [];
      let loadedCount = 0;

      prizeList.forEach((prize, idx) => {
        if (prize.gambar) {
          const img = new Image();
          img.src = prize.gambar;
          img.onload = () => {
            loadedImages[idx] = img;
            loadedCount++;
            if (loadedCount === prizeList.length) drawWheel();
          };
          img.onerror = () => {
            loadedImages[idx] = null;
            loadedCount++;
            if (loadedCount === prizeList.length) drawWheel();
          };
        } else {
          loadedImages[idx] = null;
          loadedCount++;
          if (loadedCount === prizeList.length) drawWheel();
        }
      });

      drawWheel();
    }

    function drawWheel() {
      const numSlices = prizeList.length;
      if (numSlices === 0) return;

      const arc = (2 * Math.PI) / numSlices;
      ctx.clearRect(0, 0, 400, 400);

      for (let i = 0; i < numSlices; i++) {
        const angle = i * arc;

        // 1. Irisan Roda Navy
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 195, angle, angle + arc);
        ctx.fill();
        ctx.strokeStyle = '#dccf95';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. Teks Nama Hadiah & Ikon
        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle + arc / 2);

        ctx.fillStyle = '#dccf95';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(prizeList[i].nama, 185, -5);

        const img = loadedImages[i];
        if (img) {
          ctx.drawImage(img, 110, 5, 32, 32);
        } else {
          ctx.font = '20px sans-serif';
          ctx.fillText(prizeList[i].fallback_icon || '🎁', 135, 22);
        }

        ctx.restore();
      }
    }

    async function mulaiPutaran() {
      const trxId = document.getElementById('trxId').value.trim();
      const nohp = document.getElementById('nohp').value.trim();
      const nama = document.getElementById('nama').value.trim();
      const kota = document.getElementById('kota').value.trim();
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      const resultBox = document.getElementById('resultBox');

      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');

      if (!trxId || !nohp || !nama || !kota) {
        errorText.textContent = 'Harap lengkapi kode transaksi, WhatsApp, nama, dan kota terlebih dahulu!';
        errorBox.classList.remove('hidden');
        return;
      }

      if (isSpinning) return;
      if (prizeList.length === 0) {
        errorText.textContent = 'Daftar hadiah belum tersedia.';
        errorBox.classList.remove('hidden');
        return;
      }

      // 1. Verifikasi Tiket ke Backend
      try {
        const res = await fetch('/api/spinwheel/verifikasi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: trxId, nomor_hp: nohp })
        });
        const data = await res.json();

        if (!data.success) {
          errorText.textContent = data.message;
          errorBox.classList.remove('hidden');
          return;
        }
      } catch (err) {
        errorText.textContent = 'Gagal terhubung ke server backend.';
        errorBox.classList.remove('hidden');
        return;
      }

      // 2. Putar Roda
      isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

      const numSlices = prizeList.length;
      const prizeIndex = Math.floor(Math.random() * numSlices);
      const degreesPerSlice = 360 / numSlices;
      const targetDeg = 270 - (prizeIndex * degreesPerSlice + degreesPerSlice / 2);
      const totalRounds = 360 * 6;
      currentRotation += totalRounds + (targetDeg - (currentRotation % 360) + 360) % 360;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      // 3. Tampilkan Pemenang
      setTimeout(async () => {
        const itemMenang = prizeList[prizeIndex];
        document.getElementById('hadiahText').textContent = itemMenang.nama;
        
        const imgElem = document.getElementById('hadiahImg');
        if (itemMenang.gambar) {
          imgElem.src = itemMenang.gambar;
        } else {
          imgElem.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="%23021a48" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
        }

        const waktuSekarang = new Date().toLocaleString('id-ID');
        buktiKlaimTeks = 
`*BUKTI KLAIM DOORPRIZE KAOSEDHEWE*
---------------------------------------
• Kode Transaksi : ${trxId.toUpperCase()}
• Nama Customer  : ${nama}
• No. WhatsApp   : ${nohp}
• Asal Kota      : ${kota}
• Hadiah Dimenangkan : *${itemMenang.nama}*
• Waktu Klaim    : ${waktuSekarang}
---------------------------------------
Mohon konfirmasi penyerahan hadiah. Terima kasih!`;

        resultBox.classList.remove('hidden');

        await fetch('/api/spinwheel/selesai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: trxId,
            nama_customer: nama,
            asal_kota: kota,
            hadiah: itemMenang.nama
          })
        });

        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }, 4500);
    }

    function salinBuktiKlaim() {
      if (!buktiKlaimTeks) return;
      navigator.clipboard.writeText(buktiKlaimTeks).then(() => {
        const copyText = document.getElementById('copyBtnText');
        copyText.textContent = 'Tersalin ke Clipboard! ✓';
        setTimeout(() => {
          copyText.textContent = 'Salin Teks Bukti';
        }, 2500);
      }).catch(() => {
        alert('Gagal menyalin otomatis. Silakan screenshot layar ini sebagai bukti.');
      });
    }

    function kirimKeWhatsApp() {
      if (!buktiKlaimTeks) return;
      const nomorWaAdmin = "6281234567890";
      const urlWa = `https://wa.me/${nomorWaAdmin}?text=${encodeURIComponent(buktiKlaimTeks)}`;
      window.open(urlWa, '_blank');
    }

    initPrizeList();
  </script>
</body>
</html>
