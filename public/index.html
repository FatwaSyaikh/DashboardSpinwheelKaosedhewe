<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <title>Customer Spinwheel Doorprize - Kaosedhewe</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-navy-dark { background-color: #010f2b; }
    .bg-navy-main { background-color: #021a48; }
    .text-navy { color: #021a48; }
    .border-navy { border-color: #021a48; }
    .text-gold { color: #dccf95; }
    .bg-gold { background-color: #dccf95; }
    .border-gold { border-color: #dccf95; }
    .hover-bg-gold:hover { background-color: #c9bc83; }
    .hover-bg-navy:hover { background-color: #042970; }
  </style>
</head>
<body class="bg-navy-dark min-h-screen flex flex-col items-center justify-center p-4 md:p-8 font-sans select-none text-slate-800">

  <!-- Tombol Fullscreen -->
  <button onclick="toggleFullScreen()" class="fixed top-5 right-5 z-40 bg-[#021a48] hover:bg-[#042970] text-[#dccf95] border border-[#dccf95]/50 p-3 rounded-2xl shadow-xl transition active:scale-95" title="Layar Penuh">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
    </svg>
  </button>

  <!-- Container Utama Putih Bersih dengan Border Gold -->
  <div class="w-full max-w-6xl bg-white border-4 border-[#dccf95] rounded-3xl p-6 sm:p-10 shadow-2xl">
    
    <!-- Header Branding -->
    <div class="flex items-center border-b border-slate-200 pb-5 mb-8">
      <div class="flex items-center space-x-4">
        <img src="/logo.png" alt="Logo Kaosedhewe" class="w-14 h-14 object-contain rounded-full border-2 border-gold shadow-md bg-white">
        <div>
          <h1 class="text-3xl font-black text-navy tracking-wider">KAOSEDHEWE</h1>
          <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Doorprize Lucky Spinwheel</p>
        </div>
      </div>
    </div>

    <!-- Grid 2 Kolom: Arena Roda & Formulir -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">
      
      <!-- SISI KIRI: ARENA RODA SPINWHEEL -->
      <div class="lg:col-span-6 flex flex-col items-center justify-center bg-slate-50 border border-slate-200 p-6 rounded-3xl shadow-sm">
        <div class="relative w-80 h-80 sm:w-[390px] sm:h-[390px] flex items-center justify-center p-2 rounded-full bg-white border-2 border-slate-200 shadow-inner">
          
          <!-- Jarum Petunjuk Atas -->
          <div class="absolute -top-3.5 z-30 w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-t-[34px] border-t-[#021a48] drop-shadow-lg"></div>
          
          <!-- Pin Tengah Roda KD -->
          <div class="absolute z-20 w-16 h-16 bg-navy-main rounded-full border-4 border-gold shadow-xl flex items-center justify-center">
            <span class="text-gold font-black text-sm tracking-wider">KD</span>
          </div>

          <!-- Roda Canvas -->
          <canvas id="wheel" width="400" height="400" class="rounded-full shadow-xl border-4 border-gold transition-all duration-[4500ms] cubic-bezier(0.1, 0.9, 0.2, 1) w-76 h-76 sm:w-[360px] sm:h-[360px]"></canvas>
        </div>

        <button id="spinBtn" onclick="mulaiPutaran()" class="mt-7 w-full sm:w-auto px-12 py-3.5 bg-navy-main hover-bg-navy text-gold font-black uppercase rounded-full shadow-xl transition tracking-widest text-base hover:scale-105 active:scale-95 duration-150 border border-gold">
          Putar Roda Sekarang
        </button>
      </div>

      <!-- SISI KANAN: FORMULIR INPUT TIKET -->
      <div class="lg:col-span-6 space-y-4">
        <div class="bg-slate-50 border border-slate-200 p-5 rounded-2xl">
          <h2 class="text-xl font-black text-navy tracking-wide">Masukkan Data Tiket</h2>
          <p class="text-sm text-slate-500 mt-1">Lengkapi nomor transaksi dan biodata Anda sesuai nota belanja Kaosedhewe.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Kode Transaksi</label>
            <input type="text" id="trxId" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-mono uppercase text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="TRX-001" required>
          </div>
          <div>
            <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">No. WhatsApp</label>
            <input type="text" id="nohp" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-mono text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="08123456789" required>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Nama Lengkap</label>
          <input type="text" id="nama" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">Asal Kota</label>
          <input type="text" id="kota" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-[#021a48] focus:border-[#021a48] outline-none transition shadow-sm" placeholder="Contoh: Semarang" required>
        </div>

        <!-- Kotak Error -->
        <div id="errorBox" class="hidden p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="errorText"></span>
        </div>
      </div>

    </div>
  </div>

  <!-- POP-UP MODAL PEMENANG (BACKDROP BLUR) -->
  <div id="resultModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white border-4 border-gold rounded-3xl p-6 sm:p-8 max-w-md w-full text-center space-y-4 shadow-2xl animate-in zoom-in-95 duration-200">
      
      <p class="text-sm font-extrabold text-slate-600 uppercase tracking-widest">🎉 Selamat! Anda Memenangkan:</p>
      
      <!-- Gambar Hadiah -->
      <div id="hadiahImgWrapper" class="hidden justify-center my-3">
        <img id="hadiahImg" src="" alt="Hadiah" class="w-32 h-32 object-contain rounded-2xl bg-slate-50 p-3 border-2 border-slate-200 shadow-md">
      </div>

      <p id="hadiahText" class="text-3xl font-black text-navy tracking-wide"></p>
      
      <div>
        <span class="inline-block text-xs bg-emerald-100 text-emerald-800 font-extrabold px-4 py-1.5 rounded-full border border-emerald-300">
          Tunjukkan layar / bukti ini ke kasir Kaosedhewe
        </span>
      </div>

      <!-- Tombol Aksi dalam Pop-up -->
      <div class="pt-3 flex flex-col sm:flex-row gap-2.5 justify-center">
        <button id="copyBtn" onclick="salinBuktiKlaim()" class="w-full sm:w-auto px-5 py-3 bg-white hover:bg-slate-100 text-navy font-bold text-xs rounded-xl border border-slate-300 shadow-sm transition flex items-center justify-center space-x-2 active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-navy" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          <span id="copyBtnText">Salin Teks Bukti</span>
        </button>

        <button onclick="tutupResultModal()" class="w-full sm:w-auto px-6 py-3 bg-navy-main hover-bg-navy text-gold font-black text-xs rounded-xl shadow transition active:scale-95 border border-gold">
          Tutup & Selesai
        </button>
      </div>

    </div>
  </div>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const colors = ['#021a48', '#07255f', '#021a48', '#07255f', '#021a48', '#07255f'];

    let prizeList = [];
    let sliceAngles = []; // Rentang sudut [startAngle, endAngle] tiap hadiah
    let isSpinning = false;
    let currentRotation = 0;
    let buktiKlaimTeks = '';

    const TIER_WEIGHTS = {
      'Utama': 1,   // Langka
      'Sedang': 3,  // Sedang
      'Biasa': 6    // Umum
    };

    async function initPrizeList() {
      try {
        const res = await fetch('/api/hadiah');
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
          prizeList = json.data;
        } else {
          prizeList = [
            { id: 1, nama: 'Kaos Kaosedhewe', gambar: null, stok: 5, tier: 'Utama', bobot: 1 },
            { id: 2, nama: 'Tote Bag Kanvas', gambar: null, stok: 10, tier: 'Sedang', bobot: 3 },
            { id: 3, nama: 'Voucher 50%', gambar: null, stok: 15, tier: 'Sedang', bobot: 3 },
            { id: 4, nama: 'Sticker Pack', gambar: null, stok: 50, tier: 'Biasa', bobot: 6 },
            { id: 5, nama: 'Hoodie Kaos', gambar: null, stok: 2, tier: 'Utama', bobot: 1 },
            { id: 6, nama: 'Gantungan Kunci', gambar: null, stok: 100, tier: 'Biasa', bobot: 6 }
          ];
        }

        drawWheel();
      } catch (err) {
        console.error('Gagal mengambil data hadiah:', err);
      }
    }

    function drawWheelEmpty() {
      ctx.clearRect(0, 0, 400, 400);
      ctx.fillStyle = '#021a48';
      ctx.beginPath();
      ctx.arc(200, 200, 195, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = '#dccf95';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Stok Hadiah Habis', 200, 205);
    }

    // Menggambar Roda Spinwheel (Auto-Fit Presisi Posisi & Ukuran)
    function drawWheel() {
      if (prizeList.length === 0) {
        drawWheelEmpty();
        return;
      }

      ctx.clearRect(0, 0, 400, 400);
      sliceAngles = [];

      const totalWeight = prizeList.reduce((sum, item) => {
        const w = parseInt(item.bobot) || TIER_WEIGHTS[item.tier] || 1;
        return sum + w;
      }, 0);

      let currentAngle = 0;

      for (let i = 0; i < prizeList.length; i++) {
        const item = prizeList[i];
        const weight = parseInt(item.bobot) || TIER_WEIGHTS[item.tier] || 1;
        
        const sliceAngle = (weight / totalWeight) * (2 * Math.PI);
        const startAngle = currentAngle;
        const endAngle = currentAngle + sliceAngle;

        sliceAngles.push({ startAngle, endAngle, centerAngle: startAngle + sliceAngle / 2 });

        // 1. Gambar Irisan Roda
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 195, startAngle, endAngle);
        ctx.fill();
        ctx.strokeStyle = '#dccf95';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. Gambar Teks Nama Hadiah & Stok
        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(startAngle + sliceAngle / 2);

        ctx.fillStyle = '#dccf95';
        
        const textDisplay = `${item.nama} (${item.stok ?? 0})`;
        
        // Jari-jari penulisan teks otomatis beradaptasi dengan sudut irisan (35px - 175px)
        const textRadius = Math.max(85, Math.min(175, 185 * (sliceAngle / (Math.PI / 3))));
        const maxTextLength = textRadius - 40; 

        // Hitung batas lebar irisan persis di lokasi penulisan teks
        const maxSliceWidthAtRadius = (textRadius * 0.65) * sliceAngle;

        // Mulai dari font besar (26px)
        let fontSize = 26; 
        ctx.font = `bold ${fontSize}px sans-serif`;
        
        // Pengecekan 2 arah yang presisi:
        // 1. Panjang teks tidak melampaui maxTextLength
        // 2. Tinggi font (fontSize * 0.9) tidak melampaui lebar irisan pada jari-jari tersebut
        while ((ctx.measureText(textDisplay).width > maxTextLength || (fontSize * 0.9) > maxSliceWidthAtRadius) && fontSize > 6) {
          fontSize--;
          ctx.font = `bold ${fontSize}px sans-serif`;
        }

        ctx.textAlign = 'right';
        ctx.fillText(textDisplay, textRadius, fontSize / 3.5);

        ctx.restore();

        currentAngle = endAngle;
      }
    }

    function pilihPemenangBerbobot() {
      let poolIndex = [];
      prizeList.forEach((prize, idx) => {
        const weight = parseInt(prize.bobot) || TIER_WEIGHTS[prize.tier] || 1;
        for (let w = 0; w < weight; w++) {
          poolIndex.push(idx);
        }
      });
      const rand = Math.floor(Math.random() * poolIndex.length);
      return poolIndex[rand];
    }

    async function mulaiPutaran() {
      const trxId = document.getElementById('trxId').value.trim();
      const nohp = document.getElementById('nohp').value.trim();
      const nama = document.getElementById('nama').value.trim();
      const kota = document.getElementById('kota').value.trim();
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');

      errorBox.classList.add('hidden');

      if (!trxId || !nohp || !nama || !kota) {
        errorText.textContent = 'Harap lengkapi kode transaksi, WhatsApp, nama, dan kota terlebih dahulu!';
        errorBox.classList.remove('hidden');
        return;
      }

      if (isSpinning) return;
      if (prizeList.length === 0) {
        errorText.textContent = 'Daftar hadiah belum tersedia atau stok sudah habis.';
        errorBox.classList.remove('hidden');
        return;
      }

      // 1. Verifikasi Tiket ke Backend
      try {
        const res = await fetch('/api/spinwheel/verifikasi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: trxId, nomor_hp: nohp })
        });
        const data = await res.json();

        if (!data.success) {
          errorText.textContent = data.message;
          errorBox.classList.remove('hidden');
          return;
        }
      } catch (err) {
        errorText.textContent = 'Gagal terhubung ke server backend.';
        errorBox.classList.remove('hidden');
        return;
      }

      // 2. Putar Roda
      isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

      const prizeIndex = pilihPemenangBerbobot();
      
      const targetCenterAngleRad = sliceAngles[prizeIndex].centerAngle;
      const targetCenterAngleDeg = (targetCenterAngleRad * 180) / Math.PI;

      const targetDeg = 270 - targetCenterAngleDeg;
      const totalRounds = 360 * 6;
      
      currentRotation += totalRounds + (targetDeg - (currentRotation % 360) + 360) % 360;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      // 3. Tampilkan Pemenang dalam Pop-up Modal
      setTimeout(async () => {
        const itemMenang = prizeList[prizeIndex];
        document.getElementById('hadiahText').textContent = itemMenang.nama;

        const imgWrapper = document.getElementById('hadiahImgWrapper');
        const imgElem = document.getElementById('hadiahImg');
        
        if (itemMenang.gambar) {
          imgElem.src = itemMenang.gambar;
          imgWrapper.classList.remove('hidden');
          imgWrapper.classList.add('flex');
        } else {
          imgWrapper.classList.add('hidden');
          imgWrapper.classList.remove('flex');
        }

        const waktuSekarang = new Date().toLocaleString('id-ID');
        buktiKlaimTeks = 
`*BUKTI KLAIM DOORPRIZE KAOSEDHEWE*
---------------------------------------
• Kode Transaksi : ${trxId.toUpperCase()}
• Nama Customer  : ${nama}
• No. WhatsApp   : ${nohp}
• Asal Kota      : ${kota}
• Tingkatan      : ${itemMenang.tier || 'Utama'}
• Hadiah Dimenangkan : *${itemMenang.nama}*
• Waktu Klaim    : ${waktuSekarang}
---------------------------------------
Mohon konfirmasi penyerahan hadiah. Terima kasih!`;

        // Buka Pop-up Pemenang
        document.getElementById('resultModal').classList.remove('hidden');

        // Kirim konfirmasi klaim & kurangi stok di backend
        await fetch('/api/spinwheel/selesai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: trxId,
            nama_customer: nama,
            asal_kota: kota,
            hadiah: itemMenang.nama,
            hadiah_id: itemMenang.id
          })
        });

        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        initPrizeList();
      }, 4500);
    }

    function tutupResultModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    function salinBuktiKlaim() {
      if (!buktiKlaimTeks) return;
      navigator.clipboard.writeText(buktiKlaimTeks).then(() => {
        const copyText = document.getElementById('copyBtnText');
        copyText.textContent = 'Tersalin ke Clipboard! ✓';
        setTimeout(() => {
          copyText.textContent = 'Salin Teks Bukti';
        }, 2500);
      }).catch(() => {
        alert('Gagal menyalin otomatis. Silakan screenshot layar ini sebagai bukti.');
      });
    }

    initPrizeList();
  </script>
</body>
</html>
